<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>서울투어</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8f8f1585908574cb126afeeeeb73af7e&libraries=services&autoload=false"></script>
<style>
:root{
  --ink:#1C1B18; --paper:#EFE9DC; --card:#FFFFFF;
  --brand:#A23E2C;      /* 단청 붉은빛 */
  --brand2:#3F5B4E;     /* 청자빛 초록 */
  --gold:#B8863A;       /* 단청 황토 */
  --plum:#6B4A63;       /* 자수정빛 */
  --teal:#2E6B6B;       /* 심연 청록 */
  --muted:#8B8478; --line:#E1D9C7; --danger:#B23A2E;
  --radius:16px;
  --shadow:0 1px 2px rgba(28,27,24,.04), 0 6px 16px rgba(28,27,24,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Noto Serif KR',serif;}
button{font-family:inherit;}
#app{display:none; height:100vh; height:100dvh; flex-direction:column;}
#app.active{display:flex;}

/* ---------- 로그인 ---------- */
#authScreen{
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
  padding:32px 24px; max-width:420px; margin:0 auto;
  padding-top:calc(32px + env(safe-area-inset-top,0px));
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
}
#authScreen h1{font-size:26px; margin:0 0 4px; letter-spacing:-0.3px;}
#authScreen .sub{color:var(--muted); font-size:13.5px; margin-bottom:28px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
.field input{
  width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px;
  font-size:15px; background:#fff; color:var(--ink);
}
.field input:focus{outline:2px solid var(--brand2); outline-offset:1px;}
.btn{
  width:100%; padding:13px; border:none; border-radius:10px; font-size:15px; font-weight:700;
  cursor:pointer; background:var(--brand); color:#fff; margin-top:6px;
}
.btn.secondary{background:transparent; color:var(--brand2); border:1px solid var(--brand2); font-weight:500;}
.btn:disabled{opacity:.5;}
#authMsg{font-size:12.5px; min-height:18px; margin-top:8px;}
.authToggle{text-align:center; font-size:13px; color:var(--muted); margin-top:16px;}
.authToggle a{color:var(--brand2); font-weight:700; cursor:pointer; text-decoration:none;}

/* ---------- 앱 셸 ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--paper); border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.topbar h1{font-size:19px; margin:0;}
.topbar .userchip{font-size:12px; color:var(--muted);}
.tabpanel{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.tabbar{
  display:flex; border-top:1px solid var(--line); background:#fff; flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbtn{
  flex:1; border:none; background:none; padding:9px 4px 8px; font-size:11px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
}
.tabbtn .ic{font-size:20px;}
.tabbtn.active{color:var(--brand);}

/* ---------- 공통 카드/칩 ---------- */
.section{padding:14px 16px 6px;}
.section h2{font-size:16px; margin:4px 0 10px;}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 12px; -webkit-overflow-scrolling:touch;}
.chip{
  flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
  background:#fff; font-size:12.5px; color:#5C574C; cursor:pointer; white-space:nowrap;
  font-weight:500; transition:background .15s,color .15s,border-color .15s;
}
.chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin:0 16px 12px; box-shadow:var(--shadow);
  transition:transform .12s;
}
.card:active{transform:scale(.98);}
.card h3{font-size:15.5px; margin:0 0 4px; letter-spacing:-.1px;}
.card .meta{font-size:11.5px; color:var(--muted); margin-bottom:7px; letter-spacing:.1px;}
.card .desc{font-size:13px; color:#4A473F; line-height:1.55;}
.tagrow{display:flex; gap:5px; flex-wrap:wrap; margin-top:9px;}
.tag{font-size:10.5px; padding:3.5px 9px; border-radius:7px; background:#F1ECDF; color:var(--brand2); font-weight:600; letter-spacing:.1px;}
.tag.wine{background:#F3E4E0; color:var(--brand);}
.empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:13.5px;}

/* ---------- 홈 ---------- */
.homeHero{padding:28px 20px 18px;}
.homeHero .eyebrow{font-size:12px; color:var(--brand); font-weight:700; margin:0 0 6px;}
.homeHero h1{font-size:25px; margin:0 0 6px; letter-spacing:-.4px; line-height:1.3;}
.homeHero p{font-size:13px; color:var(--muted); margin:0;}
.menuBoard{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:6px 20px 24px;
}
.menuTile{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 14px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
}
.menuTile:active{transform:scale(.97);}
.menuTile .dot{width:8px; height:8px; border-radius:50%; position:absolute; top:14px; right:14px;}
.menuTile .ic{font-size:26px;}
.menuTile .lb{font-size:14.5px; font-weight:700; letter-spacing:-.1px;}
.menuTile .sub{font-size:11px; color:var(--muted);}
.homeDivider{margin:6px 20px 0; border:none; border-top:1px solid var(--line);}
.homeFoot{padding:18px 20px 32px; font-size:12px; color:var(--muted); text-align:center;}
.choiceRow{display:flex; gap:12px; padding:4px 20px 22px;}
.choiceCard{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 14px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
}
.choiceCard:active{transform:scale(.97);}
.choiceCard .ic{font-size:30px; display:block; margin-bottom:8px;}
.choiceCard .lb{font-size:14.5px; font-weight:700;}
.choiceCard .sub{font-size:11px; color:var(--muted); margin-top:3px;}
.homeThemeGrid{display:none;}
.homeThemeGrid.show{display:block;}
.homeThemeGrid .backLink{padding:0 20px 10px; display:block;}

/* ---------- 룰렛 ---------- */
.rouletteWrap{padding:18px 0 6px; text-align:center;}
.rouletteWrap h3{font-size:13px; color:var(--muted); font-weight:700; margin:0 0 14px;}
.rouletteStage{position:relative; width:200px; height:200px; margin:0 auto 14px;}
.roulettePointer{
  position:absolute; top:-4px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent;
  border-top:16px solid var(--ink); z-index:2;
}
.rouletteWheel{
  width:200px; height:200px; border-radius:50%; border:4px solid #fff;
  box-shadow:0 2px 4px rgba(0,0,0,.1), 0 10px 24px rgba(28,27,24,.18);
  transform:rotate(0deg);
}
.rouletteHub{
  position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px;
  background:#fff; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.2);
  display:flex; align-items:center; justify-content:center; font-size:15px; z-index:2;
}
.rouletteLegend{display:flex; flex-wrap:wrap; gap:6px 10px; justify-content:center; padding:0 16px 14px;}
.legendItem{display:flex; align-items:center; gap:5px; font-size:11px; color:#4A473F;}
.legendItem i{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}

/* ---------- 지도 ---------- */
#tab-map{height:100%;}
#mapWrap{position:relative; height:100%; display:flex; flex-direction:column;}
#kakaoMap{flex:1; width:100%; background:#e8e4d8;}
.mapToolbar{
  position:absolute; top:10px; left:10px; right:10px; z-index:5;
  display:flex; gap:7px; overflow-x:auto;
}
.mapFab{
  position:absolute; right:14px; bottom:16px; z-index:5;
  background:var(--brand); color:#fff; border:none; border-radius:999px;
  padding:12px 18px; font-size:13.5px; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.2);
  cursor:pointer;
}

/* ---------- 오버레이/바텀시트 ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(20,18,14,.5); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  background:#fff; width:100%; max-width:480px; border-radius:18px 18px 0 0;
  max-height:86vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
}
.sheet .handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 14px;}
.sheet h2{font-size:18px; margin:0 0 2px;}
.sheet .close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
.detailOverlay{position:fixed; inset:0; background:#fff; z-index:60; display:none; flex-direction:column;}
.detailOverlay.show{display:flex;}
.detailHead{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); padding-top:calc(14px + env(safe-area-inset-top,0px));}
.detailHead button{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink);}
.detailHead h2{font-size:16px; margin:0; flex:1;}
.detailBody{flex:1; overflow-y:auto; padding:16px;}
.spotStep{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #F1ECDF;}
.spotStep:last-child{border-bottom:none;}
.spotNum{width:26px; height:26px; border-radius:50%; background:var(--brand2); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.spotInfo h4{margin:0 0 2px; font-size:14.5px;}
.spotInfo .cat{font-size:11.5px; color:var(--brand); margin-bottom:3px;}
.spotInfo .note{font-size:12.5px; color:var(--muted); line-height:1.5;}
.walkNote{font-size:11.5px; color:var(--muted); padding-left:38px; margin:-4px 0 4px;}
.backLink{background:none; border:none; color:var(--brand2); font-size:13px; font-weight:600; padding:0 0 10px; cursor:pointer;}
.routeCard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:0 0 10px; cursor:pointer; box-shadow:var(--shadow);}
.routeCard h3{font-size:14.5px; margin:0 0 4px;}

/* ---------- 폼 ---------- */
.formGrid{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
select{width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff;}
textarea{width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; font-size:14px; resize:vertical; min-height:60px; font-family:inherit;}
.searchResult{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.searchResult .n{font-size:13.5px; font-weight:700;}
.searchResult .a{font-size:11.5px; color:var(--muted);}
.smallBtn{padding:7px 12px; border-radius:8px; border:1px solid var(--brand2); background:#fff; color:var(--brand2); font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0;}
.rowBtns{display:flex; gap:8px; margin-top:10px;}
.rowBtns .btn{margin-top:0;}
</style>
</head>
<body>

<!-- ============ 로그인 화면 ============ -->
<div id="authScreen">
  <h1>서울투어</h1>
  <p class="sub">미술관·동네투어·숨은맛집, 우리 둘만의 서울</p>
  <div class="field"><label>닉네임 (최초 가입시)</label><input id="nickInput" type="text" placeholder="예: 민수"></div>
  <div class="field"><label>이메일</label><input id="emailInput" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>비밀번호</label><input id="pwInput" type="password" placeholder="6자 이상"></div>
  <button class="btn" id="authSubmitBtn" onclick="submitAuth()">로그인</button>
  <div id="authMsg"></div>
  <div class="authToggle" id="authToggleWrap">계정이 없으신가요? <a onclick="toggleAuthMode()">회원가입</a></div>
</div>

<!-- ============ 앱 ============ -->
<div id="app">
  <div class="topbar">
    <h1 class="serif">서울투어</h1>
    <span class="userchip" id="userChip"></span>
  </div>

  <div class="tabpanel" id="tabpanel">

    <!-- 홈 탭 -->
    <div class="tabcontent" id="tab-home">
      <div class="homeHero">
        <p class="eyebrow">TODAY'S SEOUL</p>
        <h1 class="serif">오늘 어디 갈까?</h1>
        <p>둘러볼까요, 룰렛에 맡길까요</p>
      </div>
      <div class="choiceRow">
        <button class="choiceCard" onclick="goToRecommend()">
          <span class="ic">📋</span>
          <span class="lb">추천 코스 가기</span>
          <span class="sub">14개 동네 · 8개 테마 둘러보기</span>
        </button>
        <button class="choiceCard" onclick="openRouletteFlow()">
          <span class="ic">🎯</span>
          <span class="lb">룰렛 돌리기</span>
          <span class="sub">뭘 정했는지 알려주면 나머진 룰렛이</span>
        </button>
      </div>
      <hr class="homeDivider">
      <div class="homeFoot">언제든 아래 탭에서 다시 여기로 돌아올 수 있어요</div>
    </div>

    <!-- 지도 탭 -->
    <div class="tabcontent" id="tab-map" style="display:none;">
      <div id="mapWrap">
        <div id="kakaoMap"></div>
        <div class="mapToolbar" id="mapFilterChips"></div>
        <button class="mapFab" onclick="openRouteSheet()">🚌 길찾기</button>
      </div>
    </div>

    <!-- 동네투어 탭 -->
    <div class="tabcontent" id="tab-course" style="display:none;">
      <div class="section"><h2>동네투어</h2></div>
      <div class="chiprow" id="themeChips"></div>
      <div id="courseList"></div>
    </div>

    <!-- 맛집·와인 탭 -->
    <div class="tabcontent" id="tab-food" style="display:none;">
      <div class="section" style="padding-bottom:0;">
        <div class="chiprow" style="padding-left:0;padding-right:0;">
          <button class="chip active" id="foodSrcCurated" onclick="setFoodSource('curated')">참조리스트</button>
          <button class="chip" id="foodSrcBucket" onclick="setFoodSource('bucket')">내 버킷리스트</button>
        </div>
      </div>
      <div class="chiprow" id="foodCatChips"></div>
      <div id="foodList"></div>
      <div style="padding:0 16px 20px;">
        <button class="btn" onclick="openAddPlaceSheet()">+ 버킷리스트에 장소 추가</button>
      </div>
    </div>

    <!-- 교통 탭 -->
    <div class="tabcontent" id="tab-transit" style="display:none;">
      <div class="section"><h2>귀가거점 즐겨찾기</h2>
        <p style="font-size:12.5px;color:var(--muted);margin:-4px 0 4px;">자주 가는 귀가·출발 거점을 등록해두면, 현재 위치에서 그곳까지 바로 길찾기할 수 있어요.</p>
      </div>
      <div id="favList"></div>
      <div style="padding:0 16px 20px;">
        <button class="btn secondary" onclick="openAddFavSheet()">+ 즐겨찾기 추가</button>
      </div>
    </div>

  </div>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="home" onclick="switchTab('home')"><span class="ic">🏠</span>홈</button>
    <button class="tabbtn" data-tab="map" onclick="switchTab('map')"><span class="ic">🗺️</span>지도</button>
    <button class="tabbtn" data-tab="course" onclick="switchTab('course')"><span class="ic">🏘️</span>동네투어</button>
    <button class="tabbtn" data-tab="food" onclick="switchTab('food')"><span class="ic">🍽️</span>맛집·와인</button>
    <button class="tabbtn" data-tab="transit" onclick="switchTab('transit')"><span class="ic">🚌</span>교통</button>
  </div>
</div>

<!-- ============ 코스 상세 오버레이 ============ -->
<div class="detailOverlay" id="courseDetail">
  <div class="detailHead">
    <button onclick="closeDetail('courseDetail')">←</button>
    <h2 id="courseDetailTitle"></h2>
  </div>
  <div class="detailBody" id="courseDetailBody"></div>
</div>

<!-- ============ 장소 상세 오버레이 ============ -->
<div class="detailOverlay" id="placeDetail">
  <div class="detailHead">
    <button onclick="closeDetail('placeDetail')">←</button>
    <h2 id="placeDetailTitle"></h2>
  </div>
  <div class="detailBody" id="placeDetailBody"></div>
</div>

<!-- ============ 룰렛 흐름 오버레이 ============ -->
<div class="detailOverlay" id="rouletteFlowOverlay">
  <div class="detailHead">
    <button onclick="closeDetail('rouletteFlowOverlay')">←</button>
    <h2 id="rouletteFlowTitle">뭘 정했나요?</h2>
  </div>
  <div class="detailBody" id="rouletteFlowBody"></div>
</div>

<!-- ============ 장소 추가 바텀시트 ============ -->
<div class="overlay" id="addPlaceOverlay">
  <div class="sheet" style="position:relative;">
    <button class="close" onclick="closeSheet('addPlaceOverlay')">✕</button>
    <div class="handle"></div>
    <h2>버킷리스트에 장소 추가</h2>
    <div class="formGrid">
      <input id="placeSearchInput" type="text" placeholder="가게 이름으로 검색 (예: OO식당)" style="padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;">
      <button class="smallBtn" style="align-self:flex-start;" onclick="searchPlaceForAdd()">검색</button>
      <div id="placeSearchResults"></div>
    </div>
  </div>
</div>

<!-- ============ 카테고리 선택 바텀시트 ============ -->
<div class="overlay" id="pickCategoryOverlay">
  <div class="sheet" style="position:relative;">
    <button class="close" onclick="closeSheet('pickCategoryOverlay')">✕</button>
    <div class="handle"></div>
    <h2 id="pickCategoryPlaceName" style="font-size:15px;"></h2>
    <p style="font-size:12.5px;color:var(--muted);margin:2px 0 12px;">카테고리를 선택하고, 원하면 메모도 남겨보세요.</p>
    <div class="formGrid">
      <select id="pickCategorySelect">
        <option value="한식">한식</option>
        <option value="분식">분식</option>
        <option value="양식">양식</option>
        <option value="일식">일식</option>
        <option value="중식">중식</option>
        <option value="카페">카페</option>
        <option value="와인">와인</option>
        <option value="기타">기타</option>
      </select>
      <label style="font-size:12.5px;color:var(--muted);">어느 동네투어 권역인가요? (룰렛에 포함돼요)</label>
      <select id="pickCategoryRegion"><option value="">선택 안 함</option></select>
      <textarea id="pickCategoryMemo" placeholder="메모 (추천메뉴, 느낌 등 — 선택)"></textarea>
      <button class="btn" onclick="confirmAddPlace()">버킷리스트에 저장</button>
    </div>
  </div>
</div>

<!-- ============ 즐겨찾기 추가 바텀시트 ============ -->
<div class="overlay" id="addFavOverlay">
  <div class="sheet" style="position:relative;">
    <button class="close" onclick="closeSheet('addFavOverlay')">✕</button>
    <div class="handle"></div>
    <h2>즐겨찾기 추가</h2>
    <div class="formGrid">
      <input id="favSearchInput" type="text" placeholder="장소 검색 (예: 세종문화회관)" style="padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;">

const firebaseConfig = {

};
let auth, db, currentUser=null, myNickname='';
try{
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}catch(e){ console.error('Firebase init failed', e); }

/* =====================================================================
   인증
===================================================================== */
let authMode='login';
function toggleAuthMode(){
  authMode = authMode==='login' ? 'signup' : 'login';
  document.getElementById('authSubmitBtn').textContent = authMode==='login' ? '로그인' : '가입하기';
  document.getElementById('authToggleWrap').innerHTML = authMode==='login'
    ? '계정이 없으신가요? <a onclick="toggleAuthMode()">회원가입</a>'
    : '이미 계정이 있으신가요? <a onclick="toggleAuthMode()">로그인</a>';
}
function authMsg(s, ok){
  const el=document.getElementById('authMsg');
  el.textContent = s||''; el.style.color = ok ? 'var(--brand2)' : 'var(--danger)';
}
async function submitAuth(){
  const email=document.getElementById('emailInput').value.trim();
  const pw=document.getElementById('pwInput').value;
  const nick=document.getElementById('nickInput').value.trim();
  if(!email || !pw){ authMsg('이메일과 비밀번호를 입력해주세요.'); return; }
  const btn=document.getElementById('authSubmitBtn'); btn.disabled=true;
  try{
    if(authMode==='signup'){
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await db.collection('seoul_members').doc(cred.user.uid).set({ nickname: nick||email.split('@')[0], email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    } else {
      await auth.signInWithEmailAndPassword(email, pw);
    }
  }catch(e){
    authMsg(authErrorText(e));
  }finally{ btn.disabled=false; }
}
function authErrorText(e){
  const c=e&&e.code||'';
  if(c.includes('user-not-found')) return '가입되지 않은 이메일이에요.';
  if(c.includes('wrong-password')) return '비밀번호가 맞지 않아요.';
  if(c.includes('email-already-in-use')) return '이미 가입된 이메일이에요.';
  if(c.includes('weak-password')) return '비밀번호는 6자 이상이어야 해요.';
  if(c.includes('invalid-email')) return '이메일 형식을 확인해주세요.';
  return '오류가 발생했어요: ' + (e&&e.message||'');
}
auth && auth.onAuthStateChanged(async (user)=>{
  currentUser=user;
  if(user){
    try{
      const doc = await db.collection('seoul_members').doc(user.uid).get();
      myNickname = doc.exists ? doc.data().nickname : user.email.split('@')[0];
    }catch(e){ myNickname = user.email.split('@')[0]; }
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').classList.add('active');
    document.getElementById('userChip').textContent = myNickname + '님';
    initAppData();
  } else {
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').classList.remove('active');
  }
});

/* =====================================================================

===================================================================== */
function switchTab(name){
  document.querySelectorAll('.tabcontent').forEach(el=>el.style.display='none');
  document.getElementById('tab-'+name).style.display='block';
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  if(name==='map'){ ensureKakaoMap(); }
}

function flowWheelHTML(){
  return `<div class="rouletteWrap">
    <div class="rouletteStage">
      <div class="roulettePointer"></div>
      <div class="rouletteWheel" id="flowWheel"></div>
      <div class="rouletteHub">🎯</div>
    </div>
    <div class="rouletteLegend" id="flowLegend"></div>
    <button class="btn" style="background:var(--gold); max-width:280px; margin:4px auto 0;" onclick="spinFlowWheel()">룰렛 돌리기</button>
  </div>`;
}
let flowPool=[], flowRotation=0, flowSpinning=false, flowOnLand=null;
function setupFlowWheel(pool, onLand){
  flowPool=pool; flowRotation=0; flowSpinning=false; flowOnLand=onLand;
  renderFlowWheelVisual();
}
function renderFlowWheelVisual(){
  const wheel=document.getElementById('flowWheel'); const legend=document.getElementById('flowLegend');
  if(!wheel) return;
  const n=flowPool.length;
  if(!n){ wheel.style.background='var(--line)'; legend.innerHTML='<span class="legendItem">선택지가 없어요</span>'; return; }
  const seg=360/n, colors=rouletteColors();
  wheel.style.transition='none';
  wheel.style.background = `conic-gradient(${flowPool.map((p,i)=>`${colors[i%colors.length]} ${i*seg}deg ${(i+1)*seg}deg`).join(',')})`;
  wheel.style.transform = `rotate(${flowRotation}deg)`;
  legend.innerHTML = flowPool.map((p,i)=>`<span class="legendItem"><i style="background:${colors[i%colors.length]}"></i>${i+1}. ${p.label}</span>`).join('');
}
function spinFlowWheel(){
  if(flowSpinning || !flowPool.length) return; flowSpinning=true;
  const n=flowPool.length, seg=360/n;
  const extraSpins=4+Math.floor(Math.random()*3), offset=Math.random()*360;
  flowRotation += extraSpins*360+offset;
  const wheel=document.getElementById('flowWheel');
  wheel.style.transition='transform 3.2s cubic-bezier(.15,.65,.1,1)';
  wheel.style.transform=`rotate(${flowRotation}deg)`;
  setTimeout(()=>{
    flowSpinning=false;
    const effective=((360-(flowRotation%360))+360)%360;
    const winIndex=Math.floor(effective/seg)%n;
    const winner=flowPool[winIndex];
    if(flowOnLand) flowOnLand(winner);
  }, 3300);
}

function allSpotsIndex(){
  const list=[]; const seen=new Set();
  COURSES.forEach(c=>{
    c.spots.forEach(s=>{
      if(['시작점','종료점','이동'].includes(s.cat)) return;
      if(seen.has(s.name)) return; seen.add(s.name);
      list.push({name:s.name, cat:s.cat, regionId:c.id, regionName:c.name});
    });
  });
  FOOD_REF.forEach(f=>{
    if(seen.has(f.name)) return; seen.add(f.name);
    const region = COURSES.find(c=>c.id===f.regionId);
    list.push({name:f.name, cat:f.cat, regionId:f.regionId, regionName: region?region.name:''});
  });
  return list;
}

let currentArea=null, rouletteRotation=0, rouletteSpinning=false;
function openAreaDetail(id){

function resetMapView(){

  kakaoMap.setLevel(8);

}
function rouletteColors(){ return ['#A23E2C','#3F5B4E','#B8863A','#6B4A63','#2E6B6B']; }
function roulettePool(){
  const base = currentArea.spots.filter(s=>!['시작점','종료점','이동'].includes(s.cat));
  const names = new Set(base.map(s=>s.name));
  const extra = [];
  FOOD_REF.filter(f=>f.regionId===currentArea.id && !names.has(f.name)).forEach(f=>{ extra.push(f); names.add(f.name); });
  bucketPlaces.filter(p=>p.regionId===currentArea.id && !names.has(p.name)).forEach(p=>{ extra.push(p); names.add(p.name); });
  return base.concat(extra);
}
function renderAreaRouteList(){
  const c=currentArea; const body=document.getElementById('courseDetailBody');
  const pool=roulettePool(); const n=pool.length; const seg=360/n; const colors=rouletteColors();
  const gradient = pool.map((s,i)=>`${colors[i%colors.length]} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  const legend = pool.map((s,i)=>`<span class="legendItem"><i style="background:${colors[i%colors.length]}"></i>${i+1}. ${s.name}</span>`).join('');
  body.innerHTML = `
    <div class="tagrow" style="margin-bottom:16px;">${c.themes.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <h3 style="font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:700;">추천 코스 · 반나절용으로 나눴어요</h3>
    ${c.routes.map((r,i)=>{
      const spots=c.spots.slice(r.range[0], r.range[1]);
      return `<div class="routeCard" onclick="renderRouteSteps(${i})">
        <h3>${r.name}</h3>
        <div class="meta">스팟 ${spots.length}곳</div>
        <div class="desc">${spots.map(s=>s.name).join(' → ')}</div>
      </div>`;
    }).join('')}
    <div class="rouletteWrap">
      <h3>🎡 룰렛으로 오늘의 코스 뽑기 — ${c.name} 안 맛집·버킷리스트까지 포함해서 ${n}곳 중에서 돌아가요</h3>
      <div class="rouletteStage">
        <div class="roulettePointer"></div>
        <div class="rouletteWheel" id="rouletteWheel" style="background:conic-gradient(${gradient}); transform:rotate(${rouletteRotation}deg);"></div>
        <div class="rouletteHub">🎯</div>
      </div>
      <div class="rouletteLegend">${legend}</div>
      <button class="btn" style="background:var(--gold);" onclick="spinRoulette()">룰렛 돌리기</button>
    </div>
  `;
}
function renderRouteSteps(routeIdx){
  const c=currentArea; const r=c.routes[routeIdx];
  const spots=c.spots.slice(r.range[0], r.range[1]);
  renderSteps(r.name, spots, false);
}
function spinRoulette(){
  if(rouletteSpinning) return; rouletteSpinning=true;
  const pool=roulettePool(); const n=pool.length; const seg=360/n;
  const extraSpins = 4 + Math.floor(Math.random()*3);
  const offset = Math.random()*360;
  rouletteRotation += extraSpins*360 + offset;
  const wheel=document.getElementById('rouletteWheel');
  wheel.style.transition='transform 3.2s cubic-bezier(.15,.65,.1,1)';
  wheel.style.transform=`rotate(${rouletteRotation}deg)`;
  setTimeout(()=>{
    rouletteSpinning=false;
    const effective = ((360 - (rouletteRotation % 360)) + 360) % 360;
    const winIndex = Math.floor(effective/seg) % n;
    const routeLen = Math.min(5, n);
    const picked=[]; for(let k=0;k<routeLen;k++){ picked.push(pool[(winIndex+k)%n]); }
    renderSteps('🎡 룰렛 코스', picked, true);
  }, 3300);
}
let __stepsSpots=[];
function renderSteps(title, spots, isRandom){
  __stepsSpots = spots;

          <div class="cat">${s.cat}</div>
          ${s.note?`<div class="note">${s.note}</div>`:''}
          <button class="smallBtn" style="margin-top:6px;" onclick="spotRouteClick(${i})">📍 길찾기</button>
        </div>
      </div>
      ${s.walk?`<div class="walkNote">도보 ${s.walk}</div>`:''}
    `).join('')}
    ${isRandom?`<button class="btn secondary" style="margin-top:16px;" onclick="renderAreaRouteList()">🎡 룰렛 다시 돌리기</button>`:''}
  `;
}
async function spotRouteClick(i){
  const s=__stepsSpots[i]; if(!s) return;
  if(!s.lat){
    const found = await geocodeSpot(s, currentArea ? currentArea.name : '서울');
    if(!found){ alert('위치를 찾지 못했어요. 지도 탭을 한번 연 뒤 다시 시도해주세요.'); return; }

  openRouteSheetTo(s.lat, s.lng, s.name);
}

const FOOD_CATS = ['전체','한식','분식','양식','일식','중식','카페','와인','기타'];
let foodSource='curated', activeFoodCat='전체';
let bucketPlaces=[]; // Firestore에서 로드

function renderFoodCatChips(){
  const wrap=document.getElementById('foodCatChips'); wrap.innerHTML='';
  FOOD_CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c===activeFoodCat?' active':'');
    b.textContent=c;
    b.onclick=()=>{ activeFoodCat=c; renderFoodCatChips(); renderFoodList(); };
    wrap.appendChild(b);
  });
}
function setFoodSource(src){
  foodSource=src;
  document.getElementById('foodSrcCurated').classList.toggle('active', src==='curated');
  document.getElementById('foodSrcBucket').classList.toggle('active', src==='bucket');
  renderFoodList();
}
function renderFoodList(){
  const wrap=document.getElementById('foodList'); wrap.innerHTML='';
  let list = foodSource==='curated' ? FOOD_REF : bucketPlaces;
  if(activeFoodCat!=='전체') list = list.filter(p=>p.cat===activeFoodCat);
  if(!list.length){
    wrap.innerHTML = `<div class="empty">${foodSource==='curated' ? '이 카테고리의 참조 장소가 아직 없어요.' : '아직 버킷리스트에 담긴 곳이 없어요. 아래 버튼으로 추가해보세요.'}</div>`;
    return;
  }
  list.forEach((p,i)=>{
    const card=document.createElement('div'); card.className='card';
    card.style.cursor='pointer';
    card.onclick=()=>openPlaceDetail(foodSource, i);
    card.innerHTML = `
      <h3>${p.name}</h3>
      <div class="meta">${p.cat} · ${p.area||''}</div>
      ${p.note?`<div class="desc">${p.note}</div>`:''}
      ${p.status?`<div class="tagrow"><span class="tag">${p.status}</span></div>`:''}
    `;
    wrap.appendChild(card);
  });
}
function openPlaceDetail(src, idx){
  const p = (src==='curated'?FOOD_REF:bucketPlaces)[idx]; if(!p) return;
  document.getElementById('placeDetailTitle').textContent = p.name;
  const body = document.getElementById('placeDetailBody');
  body.innerHTML = `
    <div class="tagrow" style="margin-bottom:10px;"><span class="tag">${p.cat}</span>${p.area?`<span class="tag">${p.area}</span>`:''}</div>
    ${p.note?`<p style="font-size:14px;line-height:1.6;">${p.note}</p>`:''}
    ${p.memo?`<p style="font-size:13.5px;color:var(--brand2);background:#F1ECDF;padding:10px 12px;border-radius:10px;">📝 ${p.memo}</p>`:''}
    ${p.lat ? `<button class="btn secondary" style="margin-top:8px;" onclick="openRouteSheetTo(${p.lat},${p.lng},'${p.name.replace(/'/g,"")}')">여기로 길찾기</button>` : ''}
    ${src==='bucket' ? `<button class="btn" style="background:${p.status==='다녀옴'?'var(--muted)':'var(--brand2)'};margin-top:8px;" onclick="toggleVisited(${idx})">${p.status==='다녀옴' ? '✓ 다녀왔어요' : '다녀왔어요로 표시'}</button>` : ''}
  `;
  document.getElementById('placeDetail').classList.add('show');
}
async function toggleVisited(idx){
  const p = bucketPlaces[idx]; if(!p || !p.docId) return;
  const next = p.status==='다녀옴' ? '가고싶어요' : '다녀옴';
  try{
    await db.collection('seoul_places').doc(p.docId).update({status: next});
    p.status = next;
    openPlaceDetail('bucket', idx);
    renderFoodList();
  }catch(e){ console.error(e); }
}

/* ---- 버킷리스트 추가: 카카오 검색 ---- */
let kakaoPlacesService=null;
let pendingPlace=null;
function openAddPlaceSheet(){
  document.getElementById('placeSearchInput').value='';
  document.getElementById('placeSearchResults').innerHTML='';
  document.getElementById('addPlaceOverlay').classList.add('show');
}
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
function searchPlaceForAdd(){
  const q=document.getElementById('placeSearchInput').value.trim();
  const wrap=document.getElementById('placeSearchResults');
  if(!q || !kakaoPlacesService){ wrap.innerHTML='<p style="font-size:12.5px;color:var(--muted)">검색어를 입력해주세요.</p>'; return; }
  wrap.innerHTML='<p style="font-size:12.5px;color:var(--muted)">검색 중…</p>';
  kakaoPlacesService.keywordSearch(q, (data, status)=>{
    if(status!==kakao.maps.services.Status.OK || !data.length){ wrap.innerHTML='<p style="font-size:12.5px;color:var(--muted)">검색 결과가 없어요.</p>'; return; }
    wrap.innerHTML='';
    data.slice(0,8).forEach(d=>{
      const row=document.createElement('div'); row.className='searchResult';
      row.innerHTML = `<div><div class="n">${d.place_name}</div><div class="a">${d.road_address_name||d.address_name}</div></div><button class="smallBtn">선택</button>`;
      row.querySelector('button').onclick=()=>{
        pendingPlace = {name:d.place_name, address:d.road_address_name||d.address_name, lat:parseFloat(d.y), lng:parseFloat(d.x)};
        closeSheet('addPlaceOverlay');
        document.getElementById('pickCategoryPlaceName').textContent = pendingPlace.name;
        document.getElementById('pickCategoryMemo').value='';
        populateRegionSelect();
        document.getElementById('pickCategoryOverlay').classList.add('show');
      };
      wrap.appendChild(row);
    }, {size:8});
  });
}
function populateRegionSelect(){
  const sel=document.getElementById('pickCategoryRegion');
  sel.innerHTML='<option value="">선택 안 함</option>' + COURSES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
async function confirmAddPlace(){
  if(!pendingPlace || !currentUser) return;
  const cat = document.getElementById('pickCategorySelect').value;
  const memo = document.getElementById('pickCategoryMemo').value.trim();
  const regionId = document.getElementById('pickCategoryRegion').value;
  try{
    await db.collection('seoul_places').add({
      name: pendingPlace.name, address: pendingPlace.address,
      lat: pendingPlace.lat, lng: pendingPlace.lng,
      cat, memo, regionId, status:'가고싶어요',
      addedBy: myNickname, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeSheet('pickCategoryOverlay');
    pendingPlace=null;
    await loadBucketPlaces();
    setFoodSource('bucket');
  }catch(e){ console.error(e); alert('저장에 실패했어요.'); }
}
async function loadBucketPlaces(){
  if(!db) return;
  try{
    const snap = await db.collection('seoul_places').orderBy('createdAt','desc').get();
    bucketPlaces = snap.docs.map(d=>({docId:d.id, ...d.data()}));
  }catch(e){ console.error(e); bucketPlaces=[]; }
  renderFoodList(); renderMapMarkers();
}

/* ---- 길찾기 시트 ---- */
let routeGps=null;
async function getGpsCoords(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      ()=>resolve(null), {timeout:5000, maximumAge:10*60*1000}
    );
  });
}
function populateRouteSelects(){
  ['routeFrom','routeTo'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML = '<option value="gps">내 위치</option>';
    favorites.forEach(f=>{
      const o=document.createElement('option'); o.value='fav:'+f.docId; o.textContent=f.name;
      sel.appendChild(o);
    });
    COURSES.forEach(c=>{
      const o=document.createElement('option'); o.value='course:'+c.id; o.textContent='📍 '+c.name;
      sel.appendChild(o);
    });
  });
}
function openRouteSheet(){ document.getElementById('routeOverlay').classList.add('show'); }
function openRouteSheetTo(lat,lng,name){
  document.getElementById('routeTo').innerHTML = `<option value="direct:${lat}:${lng}">${name}</option>` + document.getElementById('routeTo').innerHTML;
  document.getElementById('routeOverlay').classList.add('show');
}
async function resolveRoutePoint(val){
  if(val==='gps'){
    const g = await getGpsCoords();
    return g ? {lat:g.lat, lng:g.lng, name:'내 위치'} : null;
  }
  if(val.startsWith('fav:')){
    const f = favorites.find(x=>x.docId===val.slice(4));
    return f ? {lat:f.lat, lng:f.lng, name:f.name} : null;
  }
  if(val.startsWith('course:')){
    const c = COURSES.find(x=>x.id===val.slice(7));
    return c ? {lat:c.coord.lat, lng:c.coord.lng, name:c.name} : null;
  }
  if(val.startsWith('direct:')){
    const [,lat,lng] = val.split(':');
    return {lat:parseFloat(lat), lng:parseFloat(lng), name:'선택한 장소'};
  }
  return null;
}
async function launchRoute(){
  const fromVal=document.getElementById('routeFrom').value;
  const toVal=document.getElementById('routeTo').value;
  const mode=document.getElementById('routeMode').value;
  const from = await resolveRoutePoint(fromVal);
  const to = await resolveRoutePoint(toVal);
  if(!from || !to){ alert('출발지/도착지 좌표를 확인하지 못했어요. 위치 권한을 확인해주세요.'); return; }
  const url = `https://m.map.kakao.com/scheme/route?sp=${from.lat},${from.lng}&ep=${to.lat},${to.lng}&by=${mode}`;
  window.open(url, '_blank');
}

/* =====================================================================
   지도
===================================================================== */
let kakaoMap=null;
const MAP_CATS = ['전체','동네투어','맛집·와인','즐겨찾기'];
let activeMapCat='전체';
function renderMapFilterChips(){
  const wrap=document.getElementById('mapFilterChips'); wrap.innerHTML='';
  MAP_CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c===activeMapCat?' active':'');
    b.style.background = c===activeMapCat ? 'var(--brand)' : '#fff';
    b.textContent=c;
    b.onclick=()=>{ activeMapCat=c; renderMapFilterChips(); renderMapMarkers(); };
    wrap.appendChild(b);
  });
}
function initKakaoServices(){
  if(!window.kakao || !window.kakao.maps) return;
  kakao.maps.load(()=>{
    if(!kakaoPlacesService) kakaoPlacesService = new kakao.maps.services.Places();
  });
}
function geocodeSpot(spot, contextName){
  return new Promise((resolve)=>{
    if(spot.lat){ resolve(spot); return; }
    if(!kakaoPlacesService){ resolve(null); return; }
    kakaoPlacesService.keywordSearch(`${contextName||''} ${spot.name}`.trim(), (data,status)=>{
      if(status===kakao.maps.services.Status.OK && data.length){
        spot.lat=parseFloat(data[0].y); spot.lng=parseFloat(data[0].x);
        resolve(spot);
      } else resolve(null);
    });
  });
}
let mapMarkers=[];
function ensureKakaoMap(){
  if(!window.kakao || !window.kakao.maps) return;
  kakao.maps.load(()=>{
    if(!kakaoPlacesService) kakaoPlacesService = new kakao.maps.services.Places();
    if(!kakaoMap){
      const container = document.getElementById('kakaoMap');
      kakaoMap = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.5665,126.9780), level:8 });
    }
    renderMapMarkers();
  });
}
function renderMapMarkers(){
  if(!kakaoMap) return;
  mapMarkers.forEach(m=>m.setMap(null)); mapMarkers=[];
  const addMarker=(lat,lng,title,emoji)=>{
    const pos = new kakao.maps.LatLng(lat,lng);
    const marker = new kakao.maps.Marker({position:pos, map:kakaoMap});
    const iw = new kakao.maps.InfoWindow({content:`<div style="padding:6px 9px;font-size:12px;">${emoji} ${title}</div>`});
    kakao.maps.event.addListener(marker,'click',()=>iw.open(kakaoMap,marker));
    mapMarkers.push(marker);
  };
  if(activeMapCat==='전체' || activeMapCat==='동네투어'){
    COURSES.forEach(c=>{
      const pos = new kakao.maps.LatLng(c.coord.lat, c.coord.lng);
      const marker = new kakao.maps.Marker({position:pos, map:kakaoMap});
      kakao.maps.event.addListener(marker,'click',()=> focusAreaOnMap(c));
      mapMarkers.push(marker);
    });
  }
  if(activeMapCat==='전체' || activeMapCat==='맛집·와인'){
    bucketPlaces.forEach(p=>{ if(p.lat) addMarker(p.lat, p.lng, p.name, p.cat==='와인'?'🍷':'🍽️'); });
    FOOD_REF.forEach(p=>{ if(p.lat) addMarker(p.lat, p.lng, p.name, p.cat==='와인'?'🍷':'🍽️'); });
  }
  if(activeMapCat==='전체' || activeMapCat==='즐겨찾기'){
    favorites.forEach(f=> addMarker(f.lat, f.lng, f.name, '⭐'));
  }
}
